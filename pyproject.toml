[project]
name = "project-marketplace"
version = "0.1.0"
description = ""
authors = [
    {name = "alberta-f",email = "delyasalakhova@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.2"
pre-commit = "^4.2.0"


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations"]


select = ["E", "F", "I"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
